# Pre-commit hooks. Install via `make setup` (idempotent), or directly with
# `pre-commit install`. Run against the whole repo with `pre-commit run --all-files`.
# Versions are pinned; Dependabot bumps them weekly via `.github/dependabot.yml`.

repos:
  # Pin to the same ruff release that `pip install -e ".[dev]"` resolves so
  # `pre-commit run` and `make ci` agree on formatting. Dependabot bumps both
  # together via .github/dependabot.yml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)^(
            \.secrets\.baseline|
            tests/golden/.*|
            tests/eval/golden/.*|
            output/.*|
            \.venv/.*
          )$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
