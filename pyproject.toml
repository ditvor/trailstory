[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trailstory"
version = "0.1.0"
description = "Turn a hike into a memory worth sharing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40,<2",
    "astral>=3.2,<4",
    "click>=8.1,<9",
    "fastapi>=0.115,<1",
    "gpxpy>=1.6,<2",
    "jinja2>=3.1,<4",
    "Pillow>=12.2,<13",
    "pillow-heif>=0.16,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-multipart>=0.0.20,<1",
    "rich>=13.7,<16",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "hypothesis>=6",
    "mypy>=1.10",
    "pre-commit>=3.7,<5",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-Pillow",
]

[project.scripts]
trailstory = "trailstory.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["trailstory*", "web*"]

[tool.setuptools.package-data]
web = ["templates/*.html.j2", "static/*"]

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"
# Ruff ≥0.16 formats fenced code blocks inside Markdown. Our docs
# (CLAUDE.md, ADRs) hand-align comments in illustrative snippets that
# are not meant to be valid formatted Python — keep .md out of scope.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["trailstory", "web"]

[tool.ruff.lint.per-file-ignores]
# Demo scripts under examples/ carry dense paragraphs of Russian narrative
# (intentional, not lookalike confusables). RUF001 would flag every line.
"examples/**/*.py" = ["RUF001"]
# Builder UI copy: Russian style descriptions are intentional Cyrillic
# text, not Latin lookalikes.
"web/copy.py" = ["RUF001"]

# ── Mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["trailstory", "web"]
omit = ["trailstory/cli.py", "web/__main__.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
